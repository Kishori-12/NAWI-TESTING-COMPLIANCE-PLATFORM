<style>

</style><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script></head><body>
<header><div class="logo"><svg width="34" height="34" viewBox="0 0 34 34"><rect width="34" height="34" rx="9" fill="#f2a65a"/><path d="M17 7v18M9 25h16M9 12h16" stroke="#1b1206" stroke-width="2.2" stroke-linecap="round"/><path d="M9 12l-3.5 7a3.5 2.2 0 007 0zM25 12l-3.5 7a3.5 2.2 0 007 0z" fill="#1b1206"/></svg><div>WeighCert<small>Standards-driven NAWI testing &amp; compliance</small></div></div>
<nav id="nav"></nav>
<div class="row"><span class="mu">Role</span><select id="role" style="width:auto"><option>Technician</option><option>Reviewer</option><option>Administrator</option></select></div></header>
<main id="app"></main><footer>WeighCert · rule set versioned in code · supports authorized testing, does not certify instruments.</footer>
<script>
const $=s=>document.querySelector(s);
let db=null;try{db=JSON.parse(localStorage.getItem('wc4')||'null')}catch(e){}
db=db||{inst:[],tests:{},audit:[],reports:[]};
let role='Technician',view='dash',cur=null,lastRep=null;
const save=()=>{try{localStorage.setItem('wc4',JSON.stringify(db))}catch(e){}};
const log=a=>{db.audit.unshift({t:new Date().toLocaleString(),u:role,a});save()};
// ---- Versioned rule set (configurable, not hard-coded in the UI) ----
const RULES={version:'OIML R 76-1 rule-set v1.0',
 bands:{I:[50000,200000],II:[5000,20000],III:[500,2000],IIII:[50,200]},   // MPE band limits in multiples of e
 mult:[0.5,1,1.5],                                                        // MPE in e for each band (initial verification)
 n:{I:[50000,1e12],II:[100,100000],III:[100,10000],IIII:[100,1000]},      // allowed n = Max/e
 minE:{I:100,II:50,III:20,IIII:10}};                                       // Min >= k*e (configurable)
const mpe=(c,e,L)=>{const m=L/e,b=RULES.bands[c],k=RULES.mult;return e*(m<=b[0]?k[0]:m<=b[1]?k[1]:k[2])};
const band=(c,e,L)=>{const m=L/e,b=RULES.bands[c];return m<=b[0]?`0–${b[0]}e`:m<=b[1]?`${b[0]}e–${b[1]}e`:`>${b[1]}e`};
const rnd=(L,e)=>+(Math.round(L/e)*e).toFixed(6);
const num=v=>(v===''||v==null||isNaN(+v))?null:+v;
const r4=x=>+(+x).toFixed(4);
function plan(i){const{cls,max,min,e}=i,b=RULES.bands[cls];
 const w=[...new Set([min,b[0]*e,b[1]*e,rnd(max/2,e),max].filter(x=>x>=min&&x<=max))].sort((a,b)=>a-b);
 return{w,ecc:rnd(max/3,e),rep:[rnd(max/2,e),max]}}
const blank=i=>{const p=plan(i);return{status:'Draft',review:'',obs:{w:p.w.map(()=>['','']),ecc:['','','','',''],rep:p.rep.map(()=>['','',''])}}};
function evaluate(i,t){const p=plan(i),o=t.obs,rows=[],warn=[],{cls,e,max,min,unit}=i;
 const add=(test,item,obs,ref,lim,rule,kind)=>{const d=kind==='spread'?obs:obs-ref;const pass=Math.abs(d)<=lim+1e-9;
  rows.push({test,item,obs:r4(obs),ref:r4(ref),d:r4(d),lim:r4(lim),rule,pass,why:`${kind==='spread'?'Spread':'Error'} ${r4(d)} ${pass?'≤':'>'} limit ±${r4(lim)} ${unit}`})};
 const n=max/e,[n0,n1]=RULES.n[cls];
 rows.push({test:'Instrument',item:'Number of divisions n',obs:r4(n),ref:`${n0}–${n1>1e9?'∞':n1}`,d:'–',lim:'–',rule:`Class ${cls} n range`,pass:n>=n0&&n<=n1,why:`n = Max/e = ${r4(n)} ${n>=n0&&n<=n1?'is within':'is outside'} the allowed range`});
 const mk=RULES.minE[cls];rows.push({test:'Instrument',item:'Min ≥ '+mk+'e',obs:min,ref:mk*e,d:'–',lim:'–',rule:'Min capacity rule',pass:min>=mk*e,why:`Min ${min} ${min>=mk*e?'≥':'<'} ${mk}e = ${r4(mk*e)} ${unit}`});
 const chkE=(v,l)=>{if(Math.abs(v/e-Math.round(v/e))>1e-6)warn.push(`${l}: indication ${v} is not a multiple of e (${e})`)};
 p.w.forEach((L,k)=>['up','dn'].forEach((d,j)=>{const v=num(o.w[k][j]);const l=`Weighing ${L} ${unit} (${d=='up'?'ascending':'descending'})`;
  if(v==null)warn.push(l+': missing observation');else{chkE(v,l);if(v<0)warn.push(l+': negative indication');
  add('Weighing',l,v,L,mpe(cls,e,L),`MPE band ${band(cls,e,L)}`)}}));
 o.ecc.forEach((x,k)=>{const v=num(x),l=`Eccentricity position ${k+1} @ ${p.ecc} ${unit}`;
  if(v==null)warn.push(l+': missing observation');else{chkE(v,l);add('Eccentricity',l,v,p.ecc,mpe(cls,e,p.ecc),`MPE at applied load, band ${band(cls,e,p.ecc)}`)}});
 p.rep.forEach((L,k)=>{const vs=o.rep[k].map(num),l=`Repeatability @ ${L} ${unit}`;
  if(vs.some(v=>v==null))warn.push(l+': needs 3 readings');else{vs.forEach(v=>chkE(v,l));
   if(new Set(vs).size===1&&vs[0]!==L&&false)warn.push(l);add('Repeatability',l,Math.max(...vs)-Math.min(...vs),0,mpe(cls,e,L),`Spread ≤ MPE at load, band ${band(cls,e,L)}`,'spread')}});
 const fail=rows.some(r=>!r.pass);
 return{rows,warn,verdict:fail?'NON-COMPLIANT':warn.length?'INCOMPLETE':'COMPLIANT'}}
const bar=x=>typeof x.lim=='number'&&x.lim>0?`<div class="bar"><i class="${x.pass?'':'x'}" style="width:${Math.min(100,Math.abs(x.d)/x.lim*100)}%"></i></div>`:'';
const tag=(p)=>`<span class="tag ${p?'P':'F'}">${p?'PASS':'FAIL'}</span>`;
const vtag=v=>`<span class="tag ${v=='COMPLIANT'?'P':v=='INCOMPLETE'?'W':'F'}">${v}</span>`;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return'fallback-'+(h>>>0).toString(16)}}
// ---- Navigation ----
const NAV=[['dash','Dashboard'],['inst','Instruments'],['test','Testing'],['rep','Reports'],['repo','Repository'],['ver','Verify'],['aud','Audit trail']];
function go(v){view=v;render()}
function render(){$('#nav').innerHTML=NAV.map(([k,n])=>`<button class="${view==k?'on':''}" onclick="go('${k}')">${n}</button>`).join('');
 $('#app').innerHTML=({dash,inst,test,rep,repo,ver,aud})[view]()}
$('#role').onchange=e=>{role=e.target.value;log('Switched role to '+role);render()};
const instSel=()=>`<select onchange="cur=this.value;render()" style="max-width:340px"><option value="">— select instrument —</option>${db.inst.map(i=>`<option value="${i.id}" ${cur==i.id?'selected':''}>${esc(i.id)} · ${esc(i.name)}</option>`).join('')}</select>`;
const getI=()=>db.inst.find(i=>i.id==cur);
// ---- Views ----
function dash(){const st=s=>db.inst.filter(i=>(db.tests[i.id]||{}).status===s).length;
 return`<div class="hero"><h1>Every PASS and FAIL, with the reason attached.</h1><p>Register an instrument, get its test plan, record observations, calculate against OIML R 76, review, and seal the report.</p><i></i></div>
<div class="row" style="margin-bottom:14px"><button class="b" onclick="demo()">Try the demo instrument</button><button class="b s" onclick="go('inst')">Register instrument</button></div>
<div class="card"><h2>The workflow</h2><div class="flow">${['Instrument Registration','Test Planning','Observation Entry / Import','Data Validation','Standards-Based Calculation','Compliance Evaluation','Technical Review','Secure Report','Digital Repository'].map(s=>`<span>${s}</span>`).join('')}</div>
 <p class="mu">Rule set in use: <b>${RULES.version}</b>. This tool digitizes calculation, evaluation, review and reporting; it does not replace the authorized laboratory or legally certify an instrument. Verify rule values against the current published standards before official use.</p>
 </div>
 <div class="g"><div class="card sc"><div class="mu">Instruments</div><div class="stat">${db.inst.length}</div></div><div class="card sc"><div class="mu">Draft</div><div class="stat">${st('Draft')}</div></div><div class="card sc"><div class="mu">Awaiting review</div><div class="stat">${st('Submitted')}</div></div><div class="card sc"><div class="mu">Approved</div><div class="stat">${st('Approved')}</div></div><div class="card sc"><div class="mu">Reports issued</div><div class="stat">${db.reports.length}</div></div></div>`}
function inst(){return`<div class="card"><h2>Instrument registration</h2><div class="g">
 <label>Name/description<input id="f_name" placeholder="Platform scale"></label><label>Make / model<input id="f_make"></label><label>Serial no.<input id="f_sn"></label>
 <label>Accuracy class<select id="f_cls"><option>III</option><option>II</option><option>I</option><option>IIII</option></select></label>
 <label>Unit<select id="f_unit"><option>g</option><option>kg</option></select></label>
 <label>Max<input id="f_max" type="number" step="any"></label><label>Min<input id="f_min" type="number" step="any"></label><label>e (verification interval)<input id="f_e" type="number" step="any"></label></div>

 h=h.replace('<h3>Integrity</h3>',`<div style="display:flex;justify-content:space-around;gap:20px;margin:26px 0 8px"><div style="flex:1;border-top:1px solid var(--tx);padding-top:4px">Tested by: ${esc(m.tester)}</div><div style="flex:1;border-top:1px solid var(--tx);padding-top:4px">Reviewed by: ${esc(p.reviewerName)}</div></div><h3>Integrity</h3><div id="qr" data-t="WEIGHCERT|${R.id}|${R.hash}" style="float:right;background:#fff;padding:6px"></div>`);
 return h};
// --- Repository export ---
const _repo=repo;repo=function(){return _repo().replace('<input id="q"','<div class="row" style="margin-bottom:8px"><button class="b s" onclick="expRepo()">Export list (CSV)</button></div><input id="q"')};
function expRepo(){dlf('weighcert_reports.csv',['Report,Instrument,Serial,Date,Verdict,SHA-256',...db.reports.map(r=>{const i=JSON.parse(r.json).instrument;return[r.id,i.name,i.sn,r.time.slice(0,10),r.verdict,r.hash].map(csvq).join(',')})].join('\n'),'text/csv')}
// --- Dashboard: what needs attention ---
const _dash=dash;
dash=function(){const rv=db.inst.filter(i=>(db.tests[i.id]||{}).status=='Submitted'),dr=db.inst.filter(i=>(db.tests[i.id]||{}).status=='Draft'),bk=db.settings.lastBackup;
 const li=(a,l)=>a.map(i=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--bd);padding:6px 0"><span>${esc(i.id)} · ${esc(i.name)} <span class="mu">${l}</span></span><button class="b s" onclick="cur='${i.id}';go('test')">Open</button></div>`).join('');
 return _dash()+`<div class="card"><h2>Needs attention</h2>${rv.length?`<h3>Awaiting technical review</h3>${li(rv,'')}`:''}${dr.length?`<h3>Drafts in progress</h3>${li(dr,'')}`:''}${!rv.length&&!dr.length?'<p class="mu">Nothing pending. Register an instrument to start a new test.</p>':''}
 <h3>Recent reports</h3>${db.reports.slice(0,5).map(r=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--bd);padding:6px 0"><span>${r.id} ${vtag(r.verdict)}</span><button class="b s" onclick="lastRep='${r.id}';go('rep')">Open</button></div>`).join('')||'<p class="mu">No reports issued yet.</p>'}
 <p class="mu" style="margin-top:12px">${bk?'Last backup: '+esc(bk):'No backup taken yet — your data lives in this browser only.'} <a href="#" onclick="go('set');return false">Back up now</a></p></div>`};
// --- Settings, backup & restore ---
function settings(){const s=db.settings;
 return`<div class="card"><h2>Laboratory details</h2><p class="mu">Shown as the letterhead on every report.</p><div class="g"><label>Laboratory name<input value="${esc(s.lab)}" oninput="db.settings.lab=this.value;save()"></label><label>Approval / accreditation no.<input value="${esc(s.acc)}" oninput="db.settings.acc=this.value;save()"></label><label>Address<input value="${esc(s.addr)}" oninput="db.settings.addr=this.value;save()"></label></div></div>
 <div class="card"><h2>Backup &amp; restore</h2><p class="mu">Data is stored in this browser. Download a backup regularly, and use it to move to another device.</p>
 <div class="row"><button class="b" onclick="expDB()">Download backup (JSON)</button><button class="b s" onclick="document.getElementById('rst').click()">Restore from backup</button><input id="rst" type="file" accept=".json" hidden onchange="impDB(this)"><button class="b s" onclick="resetAll()">Erase all data</button></div></div>
 <div class="card"><h2>Rule set</h2><p class="mu">${RULES.version}. Class limits for permissible errors, allowed n ranges and Min rules are defined in one <code>RULES</code> object in the page source — check them against the current standard before official use.</p></div>`}
function expDB(){db.settings.lastBackup=new Date().toLocaleString();save();dlf('weighcert_backup_'+today()+'.json',JSON.stringify(db),'application/json');log('Backup downloaded');render()}
function impDB(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.inst)||!Array.isArray(d.reports)||!d.tests)throw 0;
 if(!confirm(`Replace current data with this backup (${d.inst.length} instruments, ${d.reports.length} reports)?`))return;db=d;db.settings=db.settings||{lab:'',acc:'',addr:''};db.audit=db.audit||[];save();log('Backup restored');cur=null;render()}catch(e){alert('That file is not a valid WeighCert backup.')}};r.readAsText(f)}
function resetAll(){if(role!=='Administrator')return alert('Switch role to Administrator to erase data.');if(!confirm('Erase ALL instruments, tests, reports and audit history? This cannot be undone.')||prompt('Type ERASE to confirm')!=='ERASE')return;db={inst:[],tests:{},audit:[],reports:[],settings:{lab:'',acc:'',addr:''}};save();cur=null;lastRep=null;render()}
render();
</script><script>
// ===== Repository upload & attachments =====
db.files=db.files||[];
document.head.insertAdjacentHTML('beforeend','<style>@media(max-width:640px){nav{flex-wrap:wrap!important;overflow:visible!important}}</style>');
const _repo2=repo;
repo=function(){const opts=db.inst.map(i=>`<option value="${i.id}">${esc(i.id)} · ${esc(i.name)}</option>`).join('');
 const kb=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.ceil(n/1024)+' KB';
 return`<div class="card"><h2>Upload to repository</h2><p class="mu">Upload a report exported from WeighCert (.json) to add it back with its integrity checked, or attach supporting files (PDF, image, CSV, Excel, Word; up to 1.5 MB) to an instrument.</p>
 <div class="g"><label>Instrument (for attachments)<select id="up_i"><option value="">— none —</option>${opts}</select></label><label>File<input id="up_f" type="file" accept=".json,.pdf,.png,.jpg,.jpeg,.csv,.xlsx,.docx"></label></div><p><button class="b" onclick="upFile()">Upload</button></p></div>`
 +_repo2()+`<div class="card"><h2>Attachments (${db.files.length})</h2><div class="tw"><table><tr><th>File</th><th>Instrument</th><th>Size</th><th>Added</th><th></th></tr>${db.files.map(f=>`<tr><td>${esc(f.name)}</td><td>${esc(f.iid||'–')}</td><td>${kb(f.size)}</td><td>${f.time.slice(0,10)}</td><td class="row"><button class="b s" onclick="dlAtt('${f.id}')">Download</button><button class="b s" onclick="delAtt('${f.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan=5 class="mu">No attachments yet.</td></tr>'}</table></div></div>`};
function upFile(){const f=$('#up_f').files[0];if(!f)return alert('Choose a file first.');const iid=$('#up_i').value;
 if(/\.json$/i.test(f.name)){const r=new FileReader();r.onload=async()=>{let d;try{d=JSON.parse(r.result)}catch(e){return alert('This is not valid JSON.')}
  if(Array.isArray(d.inst))return alert('This is a full backup. Restore it from Settings → Backup & restore.');
  if(!d.report||!d.hash||!d.report.id)return alert('Not a WeighCert report file. Use “Download JSON” on a report.');
  const json=JSON.stringify(d.report);if(await sha(json)!==d.hash)return alert('Rejected: the report content does not match its hash, so it may have been altered.');
  if(db.reports.some(x=>x.id==d.report.id))return alert('A report with ID '+d.report.id+' is already in the repository.');
  db.reports.unshift({id:d.report.id,iid:(d.report.instrument||{}).id||'',time:d.report.time,hash:d.hash,json,verdict:d.report.verdict});
  db.reports.sort((a,b)=>b.time.localeCompare(a.time));log('Uploaded report '+d.report.id);lastRep=d.report.id;alert('Report '+d.report.id+' added and verified.');go('repo')};r.readAsText(f);return}
 if(f.size>1572864)return alert('File is larger than 1.5 MB. Please compress it or keep it outside the app.');
 const r=new FileReader();r.onload=()=>{const rec={id:'F'+Date.now(),iid,name:f.name,size:f.size,time:new Date().toISOString(),data:r.result};db.files.unshift(rec);
  try{localStorage.setItem('wc4',JSON.stringify(db))}catch(e){db.files.shift();return alert('Browser storage is full. Delete some attachments or download a backup first.')}
  log(`Attached ${f.name}${iid?' to '+iid:''}`);go('repo')};r.readAsDataURL(f)}
function dlAtt(id){const f=db.files.find(x=>x.id==id),a=document.createElement('a');a.href=f.data;a.download=f.name;a.click()}
function delAtt(id){if(!confirm('Delete this attachment?'))return;db.files=db.files.filter(x=>x.id!=id);log('Deleted attachment '+id);go('repo')}
const _dash2=dash;
dash=function(){return`<div class="row" style="margin-bottom:12px"><button class="b" onclick="go('repo')">Open repository</button><button class="b s" onclick="go('repo')">Upload a report / file</button></div>`+_dash2()};
render();
</script></body></html>
